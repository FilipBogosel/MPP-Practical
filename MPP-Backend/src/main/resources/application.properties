# ── CORS ────────────────────────────────────────────────────────────────────
quarkus.http.cors=true
quarkus.http.cors.origins=/http://localhost:(5173|5174|3000)/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,origin

# ── PostgreSQL ───────────────────────────────────────────────────────────────
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/mpp_practical

# ── Hibernate ────────────────────────────────────────────────────────────────
# "update" creates tables on first run, never drops data on restart
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# ── JWT ──────────────────────────────────────────────────────────────────────
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://mpp-practical.com
smallrye.jwt.sign.key.location=privateKey.pem
