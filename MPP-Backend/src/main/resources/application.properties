# Enable CORS for frontend requests
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173,http://localhost:5174,http://localhost:3000

# Database Configuration (In-Memory H2 Database)
# To switch to PostgreSQL later, change the db-kind to postgresql, use the correct jdbc.url, and configure credentials.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:articlesdb;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=

# Hibernate Configuration
# drop-and-create ensures the schema is created on startup, which will trigger the DataInitializer.
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true
